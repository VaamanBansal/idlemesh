[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idlemesh"
version = "0.1.0.dev0"
description = "Borrow your friends' idle laptops over Wi-Fi: zero config, sandboxed, and smart about when they'll need them back."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vaaman Bansal" }]
keywords = ["distributed-computing", "lan", "scheduling", "peer-to-peer", "gpu"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "cloudpickle>=3.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
net = ["zeroconf>=0.130", "fastapi>=0.110", "uvicorn>=0.29", "pyzmq>=25"]
gpu = ["pynvml>=11.5"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
idlemesh = "idlemesh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["idlemesh"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
